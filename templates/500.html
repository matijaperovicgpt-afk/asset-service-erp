<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Server error</title>
  <!--
    QA UI-L3. Rendered by Django's server_error view with an EMPTY context
    and no request: no template tags at all, no static tag (the manifest
    storage in prod raises if anything is off), no stylesheet, no script. Whatever
    broke the page must not be able to break this one too. That also means
    {{ SITE_NAME }} is not available here - edit the header text by hand.
  -->
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
    header { background: #0f172a; color: #fff; padding: 14px 16px; font-weight: 600; letter-spacing: .02em; }
    main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #e2e8f0; padding: 24px; }
    .code { color: #64748b; font-size: .875rem; margin: 0 0 4px; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    p { line-height: 1.5; }
    a.btn { display: inline-block; margin-top: 12px; background: #2563eb; color: #fff; padding: 8px 16px; text-decoration: none; }
    a.btn:hover, a.btn:focus { background: #1d4ed8; }
  </style>
</head>
<body>
<header>Service Desk · Backoffice</header>
<main id="main" tabindex="-1">
  <div class="card">
    <p class="code">500</p>
    <h1>Server error</h1>
    <p>Something went wrong on the server. Please try again in a minute; if it keeps happening, tell the administrator what you were doing.</p>
    <a class="btn" href="/backoffice/">Back to the backoffice</a>
  </div>
</main>
</body>
</html>
