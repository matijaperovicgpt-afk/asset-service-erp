{% extends "registration/base_auth.html" %}
{% load i18n %}
{% block heading %}{% trans "Change password" %}{% endblock %}
{% block content %}
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}
      <div class="alert alert-danger py-2">
        {% for field in form %}{% for error in field.errors %}<div><small>{{ error }}</small></div>{% endfor %}{% endfor %}
      </div>
    {% endif %}
    <div class="mb-3">
      <label class="form-label" for="{{ form.old_password.id_for_label }}">{% trans "Current password" %}</label>
      <input type="password" name="old_password" class="form-control" required id="{{ form.old_password.id_for_label }}">
    </div>
    <div class="mb-3">
      <label class="form-label" for="{{ form.new_password1.id_for_label }}">{% trans "New password" %}</label>
      <input type="password" name="new_password1" class="form-control" required id="{{ form.new_password1.id_for_label }}">
    </div>
    <div class="mb-3">
      <label class="form-label" for="{{ form.new_password2.id_for_label }}">{% trans "Repeat new password" %}</label>
      <input type="password" name="new_password2" class="form-control" required id="{{ form.new_password2.id_for_label }}">
    </div>
    <button type="submit" class="btn btn-primary w-100">{% trans "Change password" %}</button>
  </form>
{% endblock %}
