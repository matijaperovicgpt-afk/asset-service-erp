{% extends "registration/base_auth.html" %}
{% load i18n %}
{% block heading %}{% trans "Reset password" %}{% endblock %}
{% block content %}
  <p><small>{% trans "Enter your e-mail address and we will send you a reset link." %}</small></p>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" for="{{ form.email.id_for_label }}">{% trans "E-mail" %}</label>
      <input type="email" name="email" class="form-control" required id="{{ form.email.id_for_label }}">
    </div>
    <button type="submit" class="btn btn-primary w-100">{% trans "Send reset link" %}</button>
  </form>
{% endblock %}
