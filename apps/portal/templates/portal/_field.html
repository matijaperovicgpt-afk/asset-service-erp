{% comment %}One form field with label, help text and errors.
Usage: {% include "portal/_field.html" with field=form.contact_name %}{% endcomment %}
<div class="mb-3" id="field-{{ field.name }}">
  <label class="form-label" for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}
    <div class="form-text">{{ field.help_text }}</div>
  {% endif %}
  {% for error in field.errors %}
    <div class="text-danger small">{{ error }}</div>
  {% endfor %}
</div>
